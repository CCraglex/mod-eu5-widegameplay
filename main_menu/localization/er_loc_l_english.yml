STATIC_MODIFIER_NAME_er_kyiv_nerf_modifier: "Collapse Of Kiev"
er_kyiv_nerf_modifier_desc: "From the devastation left by the Mongol invasions to the growing pressure of Lithuania and the Golden Horde, the Principality of Kyiv struggles to maintain its independence. Weak institutions, declining influence, and external threats leave the state vulnerable to collapse. The coming years will be very troublesome."